[project]
name = "toposafe-delta"
version = "0.1.0"
description = "Causal experiments separating communication, authorization, and execution topology in multi-agent LLM systems."
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.40,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]
plot = [
  "matplotlib>=3.8",
  "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarmsafe_delta"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

